<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('mh_theme') || localStorage.getItem('mh-theme');
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        else document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline · Muhammad Haerul</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/webp" href="/favicon.webp">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png">
  <style>
    :root {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --text: #0F172A;
      --text-secondary: #475569;
      --border: #E2E8F0;
      --blue: #1A73E8;
    }
    [data-theme="dark"] {
      --bg: #0A0E17;
      --surface: #111827;
      --text: #F8FAFC;
      --text-secondary: #94A3B8;
      --border: rgba(255, 255, 255, 0.1);
      --blue: #60A5FA;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }
    .offline-card {
      max-width: 460px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 32px;
      text-align: center;
      box-shadow: 0 20px 50px -12px rgba(15, 23, 42, 0.12);
    }
    .offline-avatar {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 18px;
      border: 3px solid var(--blue);
      display: block;
    }
    .offline-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--blue);
      background: rgba(26, 115, 232, 0.1);
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .offline-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      transition: transform 0.15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary {
      background: #1A73E8;
      color: #FFFFFF;
      border-color: #1A73E8;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <img src="/assets/profile.webp" onerror="this.src='/favicon.png'" alt="Muhammad Haerul" class="offline-avatar">
    <div class="offline-badge">Offline Mode</div>
    <h1>You're currently offline</h1>
    <p>Please check your internet connection to load uncached content, or return to the cached portfolio overview.</p>
    <div class="offline-actions">
      <button type="button" class="btn btn-primary" onclick="window.location.reload()">Try Again</button>
      <a href="/" class="btn">Portfolio Home</a>
    </div>
  </div>
</body>
</html>
